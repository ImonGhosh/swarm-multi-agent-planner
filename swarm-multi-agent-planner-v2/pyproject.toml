[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-planner"
version = "2.0.0.dev0"
description = "Decentralized SLM swarm reasoning (Tree-of-Thought + Ant Colony Optimization) for constrained calendar planning."
readme = "PLAN.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "openai>=1.40",
    "langgraph>=0.2",
    "python-dotenv>=1.0",
    "absl-py>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
